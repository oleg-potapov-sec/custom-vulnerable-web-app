
<!DOCTYPE html>
<html>
<head>
    <title>Brightspace Clone - Access Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; padding-top: 50px; }
        .form-container { background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input { display: block; margin: 10px auto; padding: 10px; width: 200px; }
        button { padding: 10px 20px; background-color: #ff8200; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>

    <h2>Brightspace Student Portal</h2>
    <div class="form-container">
        <!-- This sends the data to your python script -->
        <form action="portal.py" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            
            <button type="submit" name="action" value="login">Log In</button>
            <button type="submit" name="action" value="register" style="background-color: #555;">Register</button>
        </form>
    </div>

</body>
</html>
